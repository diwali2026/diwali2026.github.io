<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Brass kuthu vilakku favicon">
  <defs>
    <!-- Deep maroon plate so icon reads on light & dark tabs -->
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#8b2332"/>
      <stop offset="70%" stop-color="#5c1520"/>
      <stop offset="100%" stop-color="#3a0d14"/>
    </radialGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="22%" stop-color="#f0c14a"/>
      <stop offset="55%" stop-color="#c9922a"/>
      <stop offset="82%" stop-color="#8a5a12"/>
      <stop offset="100%" stop-color="#e8c35a"/>
    </linearGradient>
    <linearGradient id="brassDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6bf55"/>
      <stop offset="50%" stop-color="#a8731c"/>
      <stop offset="100%" stop-color="#6b4510"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff6b1a"/>
      <stop offset="40%" stop-color="#ffb020"/>
      <stop offset="75%" stop-color="#ffe566"/>
      <stop offset="100%" stop-color="#fff8d0"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ff8c2a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background disc -->
  <circle cx="256" cy="256" r="246" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#f0c14a" stroke-width="10" opacity="0.55"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#fff1b8" stroke-width="2" opacity="0.25"/>

  <!-- Soft warm floor glow under lamp -->
  <ellipse cx="256" cy="430" rx="110" ry="22" fill="#f0c14a" opacity="0.22"/>

  <!-- ===== KUTHU VILAKKU ===== -->
  <g>
    <!-- Base: stacked discs -->
    <ellipse cx="256" cy="418" rx="92" ry="18" fill="url(#brassDark)"/>
    <ellipse cx="256" cy="408" rx="78" ry="15" fill="url(#brass)"/>
    <ellipse cx="256" cy="398" rx="62" ry="12" fill="url(#brassDark)"/>
    <ellipse cx="256" cy="390" rx="48" ry="10" fill="url(#brass)"/>

    <!-- Lower stem knop -->
    <rect x="236" y="330" width="40" height="62" rx="8" fill="url(#brassDark)"/>
    <ellipse cx="256" cy="330" rx="28" ry="12" fill="url(#brass)"/>
    <ellipse cx="256" cy="300" rx="22" ry="10" fill="url(#brassDark)"/>

    <!-- Main stem -->
    <rect x="244" y="175" width="24" height="130" rx="6" fill="url(#brass)"/>
    <!-- Highlight stripe on stem -->
    <rect x="248" y="180" width="6" height="120" rx="3" fill="#fff1b8" opacity="0.45"/>

    <!-- Mid decorative ring -->
    <ellipse cx="256" cy="250" rx="26" ry="11" fill="url(#brassDark)"/>
    <ellipse cx="256" cy="246" rx="26" ry="9" fill="url(#brass)"/>

    <!-- Oil bowl (wide cup) -->
    <path d="M170 175
             C170 155, 200 142, 256 142
             C312 142, 342 155, 342 175
             L330 198
             C320 215, 290 228, 256 228
             C222 228, 192 215, 182 198 Z"
          fill="url(#brass)"/>
    <!-- Bowl inner rim -->
    <ellipse cx="256" cy="168" rx="78" ry="20" fill="#6b4510" opacity="0.55"/>
    <ellipse cx="256" cy="164" rx="70" ry="16" fill="#3a2208" opacity="0.65"/>
    <!-- Oil surface -->
    <ellipse cx="256" cy="162" rx="62" ry="12" fill="#c9922a" opacity="0.85"/>

    <!-- Flame glow -->
    <ellipse cx="256" cy="130" rx="48" ry="58" fill="url(#flameGlow)" filter="url(#softGlow)"/>

    <!-- Central flame (bold for small sizes) -->
    <path d="M256 70
             C272 100, 286 118, 286 138
             C286 158, 272 170, 256 170
             C240 170, 226 158, 226 138
             C226 118, 240 100, 256 70 Z"
          fill="url(#flame)" filter="url(#softGlow)"/>
    <!-- Inner flame core -->
    <path d="M256 100
             C264 116, 270 126, 270 138
             C270 148, 264 154, 256 154
             C248 154, 242 148, 242 138
             C242 126, 248 116, 256 100 Z"
          fill="#fff8d0" opacity="0.9"/>

    <!-- Side twin flames (small, for character at larger sizes) -->
    <path d="M200 120 C208 136, 214 146, 214 156 C214 166, 208 172, 200 172 C192 172, 186 166, 186 156 C186 146, 192 136, 200 120 Z"
          fill="url(#flame)" opacity="0.9"/>
    <path d="M312 120 C320 136, 326 146, 326 156 C326 166, 320 172, 312 172 C304 172, 298 166, 298 156 C298 146, 304 136, 312 120 Z"
          fill="url(#flame)" opacity="0.9"/>

    <!-- Spire above bowl -->
    <rect x="248" y="95" width="16" height="52" rx="4" fill="url(#brassDark)" opacity="0.0"/>
    <!-- Peacock / annam finial (simplified bold silhouette) -->
    <g transform="translate(256,78)">
      <!-- Body -->
      <ellipse cx="0" cy="8" rx="14" ry="10" fill="url(#brass)"/>
      <!-- Neck & head facing right -->
      <path d="M6 4 C18 -6, 28 -4, 30 4 C22 2, 16 8, 10 12 Z" fill="url(#brass)"/>
      <!-- Beak -->
      <path d="M28 2 L40 6 L28 8 Z" fill="#e8c35a"/>
      <!-- Crown / crest -->
      <path d="M22 -2 L26 -16 L30 -2 L34 -12 L36 0" fill="none" stroke="#f0c14a" stroke-width="3" stroke-linecap="round"/>
      <!-- Tail flourish left -->
      <path d="M-8 6 C-28 -10, -36 8, -18 18 C-24 6, -14 4, -8 6 Z" fill="url(#brassDark)"/>
      <!-- Eye -->
      <circle cx="24" cy="2" r="2.2" fill="#3a0d14"/>
    </g>
    <!-- Finial stand connecting to bowl -->
    <rect x="250" y="100" width="12" height="48" rx="3" fill="url(#brass)"/>
    <ellipse cx="256" cy="100" rx="10" ry="5" fill="url(#brass)"/>
  </g>
</svg>
